<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Northstar | Sign In</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="navbar">
      <div class="container navbar-inner">
        <a href="index.html" class="brand" aria-label="Northstar home">
          <span class="brand-mark">N</span>
          <span>Northstar</span>
        </a>

        <nav class="nav-links" aria-label="Main navigation">
          <a href="index.html">Home</a>
          <a href="about.html">About</a>
          <a href="signin.html">Sign In</a>
          <a href="signup.html">Sign Up</a>
        </nav>

        <div class="nav-actions">
          <a class="btn btn-secondary" href="signin.html">Log In</a>
          <a class="btn btn-primary" href="signup.html">Get Started</a>
        </div>
      </div>
    </header>

    <main class="form-shell">
      <div class="container form-layout">
        <div class="form-card">
          <h2 class="form-title">Welcome back</h2>
          <p class="form-subtitle">Sign in to continue to your dashboard.</p>

          <form id="signin-form">
            <div class="form-group">
              <label for="email">Email address</label>
              <input id="email" type="email" placeholder="you@example.com" required />
            </div>

            <div class="form-group">
              <label for="password">Password</label>
              <input id="password" type="password" placeholder="Enter your password" required />
            </div>

            <div class="form-row">
              <label class="check-wrap">
                <input type="checkbox" />
                <span>Remember me</span>
              </label>
              <a href="#" aria-label="Forgot password">Forgot password?</a>
            </div>

            <button class="btn btn-primary" type="submit">Sign In</button>
            <div class="form-message" aria-live="polite"></div>
          </form>

          <p class="form-link">Need an account? <a href="signup.html">Create one</a></p>
        </div>
      </div>
    </main>

    <footer class="site-footer">
      <div class="container">
        <p>© <span id="year"></span> Northstar. All rights reserved.</p>
      </div>
    </footer>

    <script src="script.js"></script>
  </body>
</html>
