<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Northstar | Sign Up</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="navbar">
      <div class="container navbar-inner">
        <a href="index.html" class="brand" aria-label="Northstar home">
          <span class="brand-mark">N</span>
          <span>Northstar</span>
        </a>

        <nav class="nav-links" aria-label="Main navigation">
          <a href="index.html">Home</a>
          <a href="about.html">About</a>
          <a href="signin.html">Sign In</a>
          <a href="signup.html">Sign Up</a>
        </nav>

        <div class="nav-actions">
          <a class="btn btn-secondary" href="signin.html">Log In</a>
          <a class="btn btn-primary" href="signup.html">Get Started</a>
        </div>
      </div>
    </header>

    <main class="form-shell">
      <div class="container form-layout">
        <div class="form-card">
          <h2 class="form-title">Create your account</h2>
          <p class="form-subtitle">Join teams building smarter, faster, and more confidently.</p>

          <form id="signup-form">
            <div class="form-group">
              <label for="full-name">Full name</label>
              <input id="full-name" type="text" placeholder="Jane Doe" required />
            </div>

            <div class="form-group">
              <label for="signup-email">Email address</label>
              <input id="signup-email" type="email" placeholder="you@example.com" required />
            </div>

            <div class="form-group">
              <label for="signup-password">Password</label>
              <input id="signup-password" type="password" placeholder="Create a password" required />
            </div>

            <div class="form-group">
              <label for="confirm-password">Confirm password</label>
              <input id="confirm-password" type="password" placeholder="Confirm your password" required />
            </div>

            <button class="btn btn-primary" type="submit">Create account</button>
            <div class="form-message" aria-live="polite"></div>
          </form>

          <p class="form-link">Already have an account? <a href="signin.html">Sign in</a></p>
        </div>
      </div>
    </main>

    <footer class="site-footer">
      <div class="container">
        <p>© <span id="year"></span> Northstar. All rights reserved.</p>
      </div>
    </footer>

    <script src="script.js"></script>
  </body>
</html>
